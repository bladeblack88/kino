<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Matrix IPTV</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#090b12;color:#f4f5fb;font-family:Arial,Helvetica,sans-serif}
body{font-size:16px}
header{min-height:64px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:#101522;border-bottom:1px solid #283044}
.logo{font-size:24px;font-weight:bold;letter-spacing:1px}.logo span{color:#a78bfa}
.status{color:#aab3c3;font-size:13px;text-align:right}
main{max-width:1180px;margin:0 auto;padding:16px}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
input{width:100%;min-width:0;background:#141925;color:#fff;border:1px solid #30394c;border-radius:10px;padding:13px 14px;font-size:16px}
button{min-height:44px;border:0;border-radius:10px;padding:10px 15px;background:#8055dc;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
button.secondary{background:#1c2534;border:1px solid #30394c}
button:focus,input:focus,.channel:focus{outline:3px solid #c4b5fd;outline-offset:2px}
#message{padding:13px 15px;color:#c4ccda;line-height:1.45;background:#141925;border-radius:10px;margin-bottom:14px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;white-space:nowrap;-webkit-overflow-scrolling:touch}
.filters button{flex:0 0 auto}.filters button.active{background:#5834a2}
.layout{display:block}
.playerbox{background:#000;border:1px solid #293246;border-radius:12px;overflow:hidden;margin-bottom:16px}
.video-wrap{position:relative;width:100%;height:0;padding-bottom:56.25%;background:#000}
video{position:absolute;left:0;top:0;width:100%;height:100%;background:#000}
.now{padding:13px 15px;background:#141925;font-size:17px;font-weight:bold}
.side{background:#141925;border:1px solid #293246;border-radius:12px;overflow:hidden}
.sidehead{padding:14px 16px;font-weight:bold;border-bottom:1px solid #293246;display:flex;justify-content:space-between}
#channels{max-height:45vh;overflow-y:auto;padding:7px;-webkit-overflow-scrolling:touch}
.channel{min-height:48px;padding:9px 10px;border-radius:8px;display:flex;gap:10px;align-items:center;cursor:pointer;border:1px solid transparent}
.channel:active,.channel.active{background:#1c2534;border-color:#59418a}
.num{color:#9aa5b8;width:28px;font-size:13px;flex:0 0 28px}.chname{font-weight:bold;flex:1;line-height:1.25}.star{color:#fbbf24;font-size:21px;padding:2px 7px}
.empty{padding:16px;color:#aab3c3}
footer{color:#667085;text-align:center;padding:22px 10px;font-size:12px}
@media(min-width:900px){.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.playerbox{margin-bottom:0}#channels{max-height:68vh}}
@media(max-width:520px){header{padding:11px 13px}.logo{font-size:21px}.status{font-size:11px}main{padding:12px}.toolbar{gap:7px}.toolbar button{padding:9px 10px;font-size:13px}#channels{max-height:42vh}}
</style>
<script>
window.onerror=function(message,source,line,column,error){
 var box=document.getElementById('testResults');
 if(box){box.textContent='ОШИБКА JAVASCRIPT: '+message+'\\nСтрока: '+line+', колонка: '+column+'\\nФайл: '+source;}
 return false;
};
</script>
</head>
<body>
<header><div class="logo">MATRIX <span>IPTV</span></div><div class="status" id="status">Ожидание подключения</div></header>
<main>
<div class="toolbar">
<input id="search" type="search" placeholder="Поиск телеканала…" autocomplete="off">
<button id="reload" type="button">Обновить</button>
</div>
<div id="message" role="status">Подключаемся к серверу Matrix IPTV…</div><div class="side" style="margin:14px 0;padding:14px">
<div style="font-weight:bold;margin-bottom:10px">Диагностика соединения Matrix</div>
<div style="color:#aab3c3;font-size:13px;line-height:1.4;margin-bottom:10px">Проверки выполняются из Safari. Авторизация и активация не отправляются.</div>
<div class="toolbar" style="flex-wrap:wrap"><button id="runTests" type="button">Запустить тесты</button><button id="copyTests" class="secondary" type="button">Скопировать отчёт</button></div>
<pre id="testResults" style="min-height:100px;white-space:pre-wrap;word-break:break-word;color:#dbe3f2;background:#090b12;padding:12px;border-radius:8px;font:12px/1.5 Menlo,monospace">Нажмите «Запустить тесты».</pre>

</div>
<div class="toolbar"><label for="playlistFile" style="display:block;background:#1c2534;border:1px solid #30394c;border-radius:10px;padding:12px 14px;font-weight:bold;cursor:pointer">Открыть плейлист M3U с iPad</label><input id="playlistFile" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,application/vnd.apple.mpegurl" style="display:none"></div>
<div class="filters" id="filters"><button class="active" data-cat="all" type="button">Все каналы</button><button class="secondary" id="favFilter" type="button">★ Избранное</button></div>
<div class="layout">
<section>
<div class="playerbox">
<div class="video-wrap"><video id="video" controls playsinline webkit-playsinline preload="none"></video></div>
<div class="now" id="now">Выберите телеканал</div>
</div>
</section>
<aside class="side"><div class="sidehead"><span>Телеканалы</span><span id="count">0</span></div><div id="channels"><div class="empty">Загрузка…</div></div></aside>
</div>
</main>
<footer>Matrix IPTV Web · версия для Safari и iPad</footer>
<script>
/*
 * Endpoint из анализа сетевых запросов MatrixIPTV.
 * Если сервер требует авторизационные данные приложения или запрещает CORS,
 * браузер не сможет получить список напрямую — потребуется разрешённый веб-доступ.
 */
var API_URL='https://iptv.matrix.online/server/load.php?type=itv&action=get_all_channels&JsHttpRequest=1-xml';
var allChannels=[],activeCategory='all',favoritesOnly=false,current=-1;
function byId(id){return document.getElementById(id)}
function setMessage(value){byId('message').textContent=value}
function safeFavorites(){try{return JSON.parse(localStorage.getItem('matrixFavs')||'[]')}catch(e){return []}}
function saveFavorites(value){try{localStorage.setItem('matrixFavs',JSON.stringify(value))}catch(e){}}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function firstValue(obj,keys){var i;for(i=0;i<keys.length;i++){if(obj[keys[i]]!==undefined&&obj[keys[i]]!==null&&obj[keys[i]]!=='')return obj[keys[i]]}return ''}
function extractChannels(data){
 var found=[],seen={},titleKeys=['title','name','channel_name','tv_name','channelTitle'],urlKeys=['streamUrl','stream_url','url','cmd','direct_source'];
 function walk(node,depth){
  if(!node||depth>12)return;
  if(Object.prototype.toString.call(node)==='[object Array]'){for(var i=0;i<node.length;i++)walk(node[i],depth+1);return}
  if(typeof node!=='object')return;
  var title=firstValue(node,titleKeys),url=firstValue(node,urlKeys);
  if(title&&url&&typeof url==='string'&&/^https?:\/\//i.test(url)){
   var key=String(url);
   if(!seen[key]){seen[key]=true;found.push({title:String(title),url:key,group:String(firstValue(node,['genre_title','genre','category','group-title'])||'Все каналы')})}
  }
  for(var k in node)if(Object.prototype.hasOwnProperty.call(node,k)&&node[k]&&typeof node[k]==='object')walk(node[k],depth+1);
 }
 walk(data,0);return found;
}
function parseM3U(text){
 var lines=text.replace(/^\\uFEFF/,'').split(/\\r?\\n/),out=[],pending=null,group='Все каналы',i,line,m;
 for(i=0;i<lines.length;i++){
  line=lines[i].trim();if(!line)continue;
  if(line.indexOf('#EXTINF:')===0){
   m=line.match(/group-title="([^"]*)"/i);group=m&&m[1]?m[1]:'Все каналы';
   var comma=line.lastIndexOf(',');
   pending=comma>=0?line.substring(comma+1).trim():'Канал '+(out.length+1);
  }else if(line.charAt(0)!=='#'&&pending){
   if(/^https?:\\/\\//i.test(line)){out.push({title:pending,url:line,group:group});}
   pending=null;
  }
 }
 return out;
}
function importPlaylist(file){
 if(!file)return;
 var reader=new FileReader();
 reader.onload=function(){
  var parsed=parseM3U(String(reader.result||''));
  if(!parsed.length){setMessage('В файле не найдено каналов M3U с HTTP/HTTPS ссылками.');return;}
  allChannels=parsed;activeCategory='all';favoritesOnly=false;buildFilters();render();
  byId('status').textContent='Плейлист загружен';
  setMessage('Загружено каналов: '+parsed.length+'. Выберите канал для просмотра.');
 };
 reader.onerror=function(){setMessage('Не удалось прочитать файл плейлиста.');};
 reader.readAsText(file);
}
byId('playlistFile').onchange=function(){importPlaylist(this.files&&this.files[0]);this.value='';};
function normalizeResponse(text){
 var source=text.replace(/^\uFEFF/,'').trim();
 try{return JSON.parse(source)}catch(e){}
 var match=source.match(/^[^(]*\((.*)\);?$/);
 if(match){try{return JSON.parse(match[1])}catch(e){}}
 throw new Error('Сервер вернул ответ, который не удалось разобрать');
}
function loadChannels(){
 byId('status').textContent='Подключение…';
 setMessage('Запрашиваем список телеканалов у Matrix IPTV…');
 byId('reload').disabled=true;
 var xhr=new XMLHttpRequest();
 xhr.open('GET',API_URL,true);
 xhr.timeout=20000;
 xhr.onreadystatechange=function(){
  if(xhr.readyState!==4)return;
  byId('reload').disabled=false;
  if(xhr.status<200||xhr.status>=300){
   connectionError('HTTP '+xhr.status+' — сервер не разрешил запрос или вернул ошибку');return;
  }
  try{
   var data=normalizeResponse(xhr.responseText);
   var parsed=extractChannels(data);
   if(!parsed.length){
    byId('status').textContent='Ответ получен';
    setMessage('Matrix ответил, но список каналов не распознан. Возможно, API требует параметры сеанса или структура ответа отличается. Нужен точный запрос из работающего приложения.');
    byId('channels').innerHTML='<div class="empty">Каналы пока не найдены</div>';byId('count').textContent='0';return;
   }
   allChannels=parsed;buildFilters();render();
   byId('status').textContent='Каналов: '+allChannels.length;
   setMessage('Список получен. Нажмите на канал, чтобы начать просмотр.');
  }catch(e){connectionError(e.message)}
 };
 xhr.onerror=function(){byId('reload').disabled=false;connectionError('Ошибка сети или CORS: Safari не получил доступ к API Matrix с этой страницы')};
 xhr.ontimeout=function(){byId('reload').disabled=false;connectionError('Сервер не ответил за 20 секунд')};
 xhr.send(null);
}
function connectionError(message){
 byId('status').textContent='Нет подключения';
 setMessage(message+'. Если приложение Matrix IPTV на этом же iPad работает, это не означает, что API разрешён для браузера: приложению могут требоваться собственные заголовки/сеанс.');
 byId('channels').innerHTML='<div class="empty">Список каналов недоступен. Можно открыть M3U-файл кнопкой выше.</div>';byId('count').textContent='0';
}
function buildFilters(){
 var groups=[],seen={},i;
 for(i=0;i<allChannels.length;i++){var g=allChannels[i].group;if(g&&!seen[g]){seen[g]=true;groups.push(g)}}
 var html='<button class="active" data-cat="all" type="button">Все каналы</button>';
 for(i=0;i<groups.length;i++)html+='<button class="secondary" data-cat="'+escapeHTML(groups[i])+'" type="button">'+escapeHTML(groups[i])+'</button>';
 byId('filters').innerHTML=html+'<button class="secondary" id="favFilter" type="button">★ Избранное</button>';
 var buttons=byId('filters').getElementsByTagName('button');
 for(i=0;i<buttons.length;i++)buttons[i].onclick=function(){
  if(this.id==='favFilter'){favoritesOnly=!favoritesOnly;this.className=favoritesOnly?'active':'secondary';render();return}
  favoritesOnly=false;activeCategory=this.getAttribute('data-cat');
  var bs=byId('filters').getElementsByTagName('button'),j;
  for(j=0;j<bs.length;j++)bs[j].className=bs[j]===this?'active':'secondary';
  render();
 };
}
function render(){
 var q=byId('search').value.toLowerCase(),fav=safeFavorites(),list=[],i,c,html='';
 for(i=0;i<allChannels.length;i++){
  c=allChannels[i];
  if(activeCategory!=='all'&&c.group!==activeCategory)continue;
  if(favoritesOnly&&fav.indexOf(c.url)===-1)continue;
  if(c.title.toLowerCase().indexOf(q)===-1)continue;
  list.push({channel:c,index:i});
 }
 byId('count').textContent=String(list.length);
 for(i=0;i<list.length;i++){
  c=list[i].channel;
  html+='<div class="channel '+(current===list[i].index?'active':'')+'" tabindex="0" role="button" data-index="'+list[i].index+'"><span class="num">'+(list[i].index+1)+'</span><span class="chname">'+escapeHTML(c.title)+'</span><span class="star" data-star="'+list[i].index+'" aria-label="Избранное">'+(fav.indexOf(c.url)!==-1?'★':'☆')+'</span></div>';
 }
 byId('channels').innerHTML=html||'<div class="empty">Ничего не найдено</div>';
 var rows=byId('channels').getElementsByClassName('channel');
 for(i=0;i<rows.length;i++)rows[i].onclick=function(){playChannel(parseInt(this.getAttribute('data-index'),10))};
 var stars=byId('channels').querySelectorAll('[data-star]');
 for(i=0;i<stars.length;i++)stars[i].onclick=function(e){
  e.stopPropagation();var item=allChannels[parseInt(this.getAttribute('data-star'),10)],a=safeFavorites(),at=a.indexOf(item.url);
  if(at===-1)a.push(item.url);else a.splice(at,1);saveFavorites(a);render();
 };
}
function playChannel(index){
 var channel=allChannels[index];if(!channel)return;
 current=index;byId('now').textContent=channel.title;
 var video=byId('video');
 video.pause();video.src=channel.url;video.load();
 var result=video.play();
 if(result&&typeof result.catch==='function')result.catch(function(){setMessage('Нажмите Play в видеоплеере. На iPad воспроизведение начинается только после действия пользователя.')});
 render();
}
var testReport='';
function runConnectionTests(){
 var box=byId('testResults'),lines=[];
 if(!box){alert('Не найден блок диагностики');return false;}
 box.textContent='Кнопка нажата. Запускаю проверки…';
 try {
 function add(s){lines.push(s);box.textContent=lines.join('\n');testReport=lines.join('\n');}
 function requestTest(label,url,done){
  var x=new XMLHttpRequest(),finished=false,timer;
  add(label+': проверка…');x.open('GET',url,true);x.timeout=12000;x.withCredentials=false;
  function finish(result){if(finished)return;finished=true;clearTimeout(timer);add(label+': '+result);if(done)done();}
  x.onreadystatechange=function(){if(x.readyState!==4)return;var body='';try{body=String(x.responseText||'').replace(/\s+/g,' ').substring(0,220)}catch(e){}if(x.status>0)finish('HTTP '+x.status+(body?' | ответ: '+body:'')+' | CORS разрешил прочитать ответ');};
  x.onerror=function(){finish('ОШИБКА СЕТИ/CORS — Safari не дал прочитать ответ (это не доказывает, что сервер выключен)')};
  x.ontimeout=function(){finish('ТАЙМАУТ через 12 секунд')};
  try{x.send(null)}catch(e){finish('ОШИБКА запуска: '+e.message)}
 }
 add('Matrix IPTV — отчёт диагностики');add('Дата: '+(new Date()).toString());add('Страница: '+location.href);
 add('Браузер: '+navigator.userAgent);add('navigator.onLine: '+navigator.onLine);add('Протокол страницы: '+location.protocol);
 add('Видео HLS native: '+(byId('video').canPlayType('application/vnd.apple.mpegurl')||'нет'));
 add('Видео MP4: '+(byId('video').canPlayType('video/mp4')||'нет'));
 requestTest('API список каналов',API_URL,function(){
  requestTest('API проверка активации (только GET, без активации)','https://iptv.matrix.online/api/v1/auth/app/activate/check',function(){add('--- КОНЕЦ ОТЧЁТА ---');});
 });
 } catch(e) { box.textContent='Ошибка JavaScript диагностики: '+(e.message||e); testReport=box.textContent; }
 return false;
}
byId('runTests').onclick=runConnectionTests;
byId('copyTests').onclick=function(){
 if(!testReport){setMessage('Сначала запустите тесты.');return}
 function fallbackCopy(){var t=document.createElement('textarea');t.value=testReport;document.body.appendChild(t);t.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(t);setMessage(ok?'Отчёт скопирован. Пришлите его сюда.':'Не удалось скопировать. Выделите текст отчёта вручную.')}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(testReport).then(function(){setMessage('Отчёт скопирован. Пришлите его сюда.')},fallbackCopy)}else fallbackCopy();
};
byId('reload').onclick=loadChannels;
byId('search').oninput=render;
loadChannels();
</script>
<script>
(function(){
 var b=document.getElementById('runTests'),out=document.getElementById('testResults'),copy=document.getElementById('copyTests');
 if(!b||!out)return;
 var report='';
 function run(){
  b.disabled=true;out.textContent='Запускаю безопасные GET-проверки…';report='';
  var lines=[];
  function log(s){lines.push(s);report=lines.join('\n');out.textContent=report;}
  function test(label,url,next){
   log(label+': запрос…');
   var x=new XMLHttpRequest(),done=false,t=setTimeout(function(){finish('ТАЙМАУТ (15 секунд)')},15000);
   function finish(result){if(done)return;done=true;clearTimeout(t);log(label+': '+result);if(next)next();}
   try{
    x.open('GET',url,true);x.timeout=15000;
    x.onload=function(){var body='';try{body=(x.responseText||'').replace(/\\s+/g,' ').slice(0,500)}catch(e){}
     finish('HTTP '+x.status+(body?' | тело: '+body:'')+' | CORS разрешил прочитать ответ');};
    x.onerror=function(){finish('ОШИБКА CORS/СЕТИ — браузер не смог прочитать ответ')};
    x.ontimeout=function(){finish('ТАЙМАУТ XHR')};
    x.send();
   }catch(e){finish('ОШИБКА запуска: '+e.message)}
  }
  log('MATRIX IPTV — БЕЗОПАСНАЯ ДИАГНОСТИКА');
  log('Время: '+new Date().toString());
  log('Браузер: '+navigator.userAgent);
  log('navigator.onLine: '+navigator.onLine);
  log('Страница: '+location.href);
  log('Проверяются только GET-запросы чтения. Активация, вход и изменение данных НЕ выполняются.');
  test('Контроль CORS (GitHub API)','https://api.github.com/',function(){
   test('Matrix — базовый load.php','https://iptv.matrix.online/server/load.php',function(){
    test('Matrix — список каналов','https://iptv.matrix.online/server/load.php?type=itv&action=get_all_channels&JsHttpRequest=1-xml',function(){
     test('Matrix — жанры','https://iptv.matrix.online/server/load.php?type=itv&action=get_genres&JsHttpRequest=1-xml',function(){
      test('Matrix — таблица данных','https://iptv.matrix.online/server/load.php?type=itv&action=get_simple_data_table&JsHttpRequest=1-xml',function(){
       log('--- ТЕСТЫ ЗАВЕРШЕНЫ ---');b.disabled=false;
      });
     });
    });
   });
  });
 }
 b.onclick=run;
 if(copy)copy.onclick=function(){
  if(!report){out.textContent='Сначала запустите тесты.';return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
   navigator.clipboard.writeText(report).then(function(){out.textContent=report+'\n\nОтчёт скопирован.'},function(){out.textContent=report+'\n\nСкопируйте текст вручную.'});
  }else{out.textContent=report+'\n\nВыделите и скопируйте текст вручную.';}
 };
})();
</script>
</body>
</html>
