
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="UMKA PLAY">
<meta name="theme-color" content="#101014">
<title>UMKA PLAY</title>

<style>
* { box-sizing:border-box; }
body {
    margin:0;
    background:#101014;
    color:white;
    font-family:Arial,sans-serif;
}
header {
    background:#19191f;
    padding:17px;
    border-bottom:1px solid #34343e;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo {
    font-size:25px;
    font-weight:bold;
}
.logo span { color:#ff414b; }
main {
    max-width:1000px;
    margin:auto;
    padding:15px;
}
.hero {
    padding:25px 18px;
    border-radius:16px;
    background:linear-gradient(120deg,#6d1728,#25202d);
    margin-bottom:18px;
}
.hero h1 { font-size:26px; margin:0 0 10px; }
.hero p { color:#ddd; font-size:13px; line-height:1.5; }
.search {
    width:100%;
    padding:14px;
    background:#24242d;
    border:1px solid #444;
    border-radius:10px;
    color:white;
    font-size:16px;
    margin-bottom:15px;
}
nav {
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:15px;
}
nav button {
    background:#292932;
    color:white;
    border:0;
    padding:11px 16px;
    border-radius:20px;
    white-space:nowrap;
}
nav button.active {
    background:#ff414b;
}
h2 {
    font-size:19px;
    margin:15px 0;
}
.grid {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}
.card {
    background:#202027;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #383840;
    cursor:pointer;
}
.poster {
    height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    text-align:center;
    background:linear-gradient(135deg,#7c2536,#25202d);
}
.info { padding:11px; }
.name { font-weight:bold; font-size:14px; }
.desc { color:#aaa; font-size:11px; margin-top:6px; }
.play { color:#ff626b; font-size:12px; margin-top:9px; }
.player {
    display:none;
    background:#050505;
    border:1px solid #444;
    padding:10px;
    border-radius:12px;
    margin-bottom:20px;
}
.player.show { display:block; }
.player video,
.player iframe {
    width:100%;
    aspect-ratio:16/9;
    border:0;
    background:black;
    border-radius:8px;
}
.player-title {
    margin:5px 0 10px;
    font-weight:bold;
}
.close {
    background:#ff414b;
    border:0;
    color:white;
    padding:9px 14px;
    border-radius:8px;
    margin-bottom:10px;
}
footer {
    text-align:center;
    padding:25px;
    color:#666;
    font-size:11px;
}
@media(min-width:650px) {
    .grid { grid-template-columns:repeat(4,1fr); }
    .poster { height:175px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">UMKA<span>PLAY</span></div>
    <div>📺 Онлайн</div>
</header>

<main>

<section class="hero">
    <h1>СМОТРИ ЛЮБИМОЕ</h1>
    <p>Телевидение, фильмы, сериалы и мультфильмы в одном приложении.</p>
</section>

<input class="search" id="search"
       placeholder="🔎 Поиск фильмов и каналов..."
       oninput="render()">

<nav id="nav">
    <button class="active" onclick="category('all',this)">Главная</button>
    <button onclick="category('tv',this)">ТВ</button>
    <button onclick="category('movies',this)">Фильмы</button>
    <button onclick="category('series',this)">Сериалы</button>
    <button onclick="category('kids',this)">Детям</button>
    <button onclick="category('saved',this)">Избранное</button>
</nav>

<section class="player" id="player">
    <div class="player-title" id="playerTitle"></div>
    <button class="close" onclick="closePlayer()">✕ Закрыть</button>
    <video id="video" controls playsinline
           webkit-playsinline></video>
    <iframe id="frame" allowfullscreen
            style="display:none"></iframe>
</section>

<h2 id="heading">Рекомендуем</h2>
<div class="grid" id="catalog"></div>

</main>

<footer>UMKA PLAY · ONLINE CINEMA</footer>

<script>

// ДОБАВЛЯЙ СЮДА СВОИ ЛЕГАЛЬНЫЕ ИСТОЧНИКИ

const content = [

{
 title:"Открытое кино",
 category:"movies",
 description:"Фильмы с открытой лицензией",
 poster:"🎬 КИНО",
 url:"https://archive.org/details/feature_films",
 type:"link"
},

{
 title:"Plex — бесплатное кино",
 category:"movies",
 description:"Официальная библиотека Plex",
 poster:"PLEX",
 url:"https://watch.plex.tv/",
 type:"link"
},

{
 title:"Мосфильм",
 category:"movies",
 description:"Официальная коллекция",
 poster:"МОСФИЛЬМ",
 url:"https://www.youtube.com/@MosfilmRuOfficial",
 type:"link"
},

{
 title:"Мультфильмы",
 category:"kids",
 description:"Открытая анимация",
 poster:"🐻 ДЕТЯМ",
 url:"https://archive.org/details/animationandcartoons",
 type:"link"
},

{
 title:"Документальное кино",
 category:"series",
 description:"Документальные фильмы",
 poster:"🌍 DOC",
 url:"https://archive.org/details/movies",
 type:"link"
},

{
 title:"Добавить телеканал",
 category:"tv",
 description:"Подключить свой поток",
 poster:"📺 LIVE TV",
 url:"",
 type:"empty"
}

];

let currentCategory="all";
let favorites=JSON.parse(
    localStorage.getItem("umkaFavorites") || "[]"
);

function category(cat,button) {
    currentCategory=cat;

    document.querySelectorAll("nav button")
        .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");
    render();
}

function render() {

    const query=document.getElementById("search")
        .value.toLowerCase();

    const catalog=document.getElementById("catalog");
    catalog.innerHTML="";

    const list=content.filter(item=>{

        const categoryOK=
            currentCategory==="all" ||
            (currentCategory==="saved"
                ? favorites.includes(item.title)
                : item.category===currentCategory);

        const searchOK=
            item.title.toLowerCase().includes(query) ||
            item.description.toLowerCase().includes(query);

        return categoryOK && searchOK;
    });

    document.getElementById("heading").textContent=
        currentCategory==="tv" ? "Телеканалы" :
        currentCategory==="movies" ? "Фильмы" :
        currentCategory==="series" ? "Сериалы" :
        currentCategory==="kids" ? "Мультфильмы" :
        currentCategory==="saved" ? "Избранное" :
        "Рекомендуем";

    list.forEach(item=>{

        const card=document.createElement("div");
        card.className="card";

        card.innerHTML=`
            <div class="poster">${item.poster}</div>
            <div class="info">
                <div class="name">${item.title}</div>
                <div class="desc">${item.description}</div>
                <div class="play">▶ ОТКРЫТЬ</div>
                <button style="margin-top:10px"
                    onclick="event.stopPropagation();favorite('${item.title.replace(/'/g,"\\'")}')">
                    ${favorites.includes(item.title)?"♥":"♡"}
                </button>
            </div>
        `;

        card.addEventListener("click",()=>openItem(item));
        catalog.appendChild(card);
    });

    if(!list.length) {
        catalog.innerHTML="<p>Ничего не найдено.</p>";
    }
}

function favorite(title) {
    if(favorites.includes(title)) {
        favorites=favorites.filter(x=>x!==title);
    } else {
        favorites.push(title);
    }

    localStorage.setItem(
        "umkaFavorites",
        JSON.stringify(favorites)
    );

    render();
}

function openItem(item) {

    if(item.type==="empty") {
        alert("Добавь ссылку на легальный поток в массив content.");
        return;
    }

    if(item.type==="video") {
        document.getElementById("frame").style.display="none";
        const video=document.getElementById("video");
        video.style.display="block";
        video.src=item.url;
        video.load();
        video.play().catch(()=>{});
    } else {
        closePlayer();
        window.open(item.url,"_blank");
        return;
    }

    document.getElementById("playerTitle").textContent=item.title;
    document.getElementById("player").classList.add("show");
    document.getElementById("player")
        .scrollIntoView({behavior:"smooth"});
}

function closePlayer() {
    const video=document.getElementById("video");
    video.pause();
    video.removeAttribute("src");
    video.load();

    const frame=document.getElementById("frame");
    frame.src="about:blank";
    frame.style.display="none";

    document.getElementById("player")
        .classList.remove("show");
}

render();

</script>
</body>
</html>
